<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evaluations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="evals.css" />
</head>

<body class="evals-body">
    <div class="app evals-app">
        <header class="header">
            <div class="header-left">
                <span class="header-mark">///</span>
                <span class="header-title">evaluations</span>
                <a class="header-link" href="index.html">orchestrator</a>
            </div>
            <div class="header-right">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusIndicator">idle</span>
            </div>
        </header>

        <div class="evals-scroll">
            <!-- scenario picker -->
            <section class="panel">
                <div class="panel-head">
                    <span class="panel-mark">///</span>
                    <span class="panel-title">scenario</span>
                    <span class="panel-note" id="datasetNote">loading dataset</span>
                </div>
                <div class="select-row">
                    <div class="select-wrap">
                        <select id="scenarioSelect" disabled>
                            <option value="">loading…</option>
                        </select>
                        <svg class="select-arrow" width="10" height="10" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9" />
                        </svg>
                    </div>
                    <span class="select-meta" id="selectMeta"></span>
                </div>
            </section>

            <!-- dataset json + play -->
            <section class="panel scenario-panel">
                <div class="panel-head">
                    <span class="panel-mark">///</span>
                    <span class="panel-title">dataset</span>
                    <span class="panel-note" id="scenarioNote">no scenario selected</span>
                </div>
                <pre class="scenario-json" id="scenarioJson">select a scenario to view its cases</pre>
                <button class="play-btn" id="playBtn" type="button" title="Run evaluation" aria-label="Run evaluation"
                    disabled>
                    <svg class="play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="7 4 20 12 7 20" />
                    </svg>
                    <span class="play-spinner"></span>
                </button>
            </section>

            <!-- results -->
            <section class="panel results-panel">
                <div class="panel-head">
                    <span class="panel-mark">///</span>
                    <span class="panel-title">results</span>
                    <span class="panel-note" id="resultsNote">not run yet</span>
                </div>
                <div class="summary-row" id="summaryRow" hidden>
                    <div class="stat">
                        <span class="stat-value" id="statTotal">0</span>
                        <span class="stat-label">total</span>
                    </div>
                    <div class="stat pass">
                        <span class="stat-value" id="statPassed">0</span>
                        <span class="stat-label">passed</span>
                    </div>
                    <div class="stat fail">
                        <span class="stat-value" id="statFailed">0</span>
                        <span class="stat-label">failed</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="statRate">—</span>
                        <span class="stat-label">pass rate</span>
                    </div>
                </div>
                <div class="results-body" id="resultsBody">
                    <div class="results-empty">
                        <span class="empty-mark">///</span>
                        <span class="empty-text">no run yet</span>
                        <span class="empty-sub">pick a scenario and hit play</span>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="evals.js"></script>
</body>

</html>
