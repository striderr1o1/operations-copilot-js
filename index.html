<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orchestrator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="ingestion">
        <div class="ingestion-head">
            <span class="ingestion-mark">///</span>
            <span class="ingestion-title">ingestion</span>
        </div>

        <label class="upload-zone" id="uploadZone" for="pdfInput">
            <svg class="upload-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 3v4a1 1 0 0 0 1 1h4" />
                <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z" />
                <line x1="12" y1="11" x2="12" y2="17" />
                <polyline points="9 14 12 11 15 14" />
            </svg>
            <span class="upload-label">upload pdf</span>
            <span class="upload-hint">drop file or click to browse</span>
        </label>
        <input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden />

        <div class="field">
            <label class="field-label" for="namespaceInput">namespace</label>
            <input type="text" id="namespaceInput" class="field-input" placeholder="e.g. project-docs"
                autocomplete="off" spellcheck="false" />
        </div>

        <button class="ingest-btn" id="ingestBtn" type="button" disabled>
            <span class="ingest-btn-label">ingest</span>
        </button>

        <div class="ingestion-list" id="ingestionList"></div>
    </div>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <span class="header-mark">///</span>
                <span class="header-title">orchestrator</span>
                <a class="header-link" href="evals.html">evaluations</a>
            </div>
            <div class="header-right">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusIndicator">idle</span>
            </div>
        </header>

        <div class="chat" id="chatMessages">
            <div class="empty-state">
                <div class="empty-mark">///</div>
                <p class="empty-text">multi-agent orchestration</p>
                <p class="empty-sub">ask anything to begin</p>
            </div>
        </div>

        <div class="logs" id="logsPanel">
            <div class="logs-content" id="logsContent"></div>
        </div>

        <div class="input-bar">
            <input type="text" id="queryInput" placeholder="message" autocomplete="off" spellcheck="false" />
            <button id="sendBtn" title="Send" aria-label="Send">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12" />
                    <polyline points="12 5 19 12 12 19" />
                </svg>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
